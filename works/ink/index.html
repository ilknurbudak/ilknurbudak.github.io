<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>islak murekkep siluet</title>
<style>
  :root{ --bg:#0a0b0d; --panel:#111317; --line:#23262c; --txt:#cfd2d8; --dim:#7b7f87; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
  .wrap{display:flex;height:100%;}
  .stage{flex:1 1 auto;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:#000;overflow:hidden;padding:20px;}
  canvas{display:block;background:#000;max-width:100%;max-height:100%;height:auto;width:auto;box-shadow:0 0 0 1px #16181c;}
  .hint{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:var(--dim);
    font-size:12px;letter-spacing:.3px;pointer-events:none;}
  .panel{flex:0 0 auto;width:clamp(150px,16vw,200px);height:100%;
    border-left:1px solid var(--line);background:var(--panel);
    padding:18px 16px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;}
  .panel h1{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin:0 0 2px;}
  .row{display:flex;flex-direction:column;gap:6px;}
  .row label{font-size:11px;letter-spacing:.4px;color:var(--dim);display:flex;justify-content:space-between;}
  .row label span{color:var(--txt);}
  input[type=range]{-webkit-appearance:none;appearance:none;height:2px;background:var(--line);outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#cfd2d8;cursor:pointer;}
  .seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;}
  .seg button{flex:1;background:transparent;color:var(--dim);border:0;padding:6px 0;font-size:11px;letter-spacing:.5px;cursor:pointer;}
  .seg button.on{background:#1b1e23;color:var(--txt);}
  .btns{display:flex;gap:8px;margin-top:2px;}
  .btns button{flex:1;background:transparent;border:1px solid var(--line);color:var(--txt);padding:9px 0;font-size:11px;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;border-radius:2px;}
  .btns button:hover{border-color:#3a3e45;}
  .btns button.rec{color:#e7c2c2;border-color:#3a2a2a;}
  .drop{border:1px dashed var(--line);border-radius:2px;padding:14px 10px;text-align:center;font-size:11px;color:var(--dim);cursor:pointer;letter-spacing:.3px;}
  .drop.over{border-color:#5a6068;color:var(--txt);}
  .toggle{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);cursor:pointer;letter-spacing:.4px;}
  .toggle input{accent-color:#cfd2d8;}
  .err{position:absolute;top:14px;left:14px;right:14px;color:#e7c2c2;font-size:12px;display:none;}

  /* Künye: difference ile zemine göre kendini tersler. */
  .kunye{position:absolute;left:14px;bottom:12px;z-index:5;display:flex;flex-wrap:wrap;
    gap:0 10px;max-width:calc(100% - 28px);font-size:10px;line-height:1.4;letter-spacing:.02em;
    font-weight:500;color:#fff;mix-blend-mode:difference;pointer-events:none;}

  @media (max-width:640px),(max-height:420px){
    .wrap{flex-direction:column;}
    .panel{width:100%;height:auto;max-height:38%;border-left:0;border-top:1px solid var(--line);}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="hint" id="hint">drag a silhouette image here</div>
    <div class="err" id="err"></div>
    <div class="kunye" id="kunye"><span class="ad">İLKNUR BUDAK</span><span class="eser">ink</span><span class="model"></span><span class="seed"></span></div>
  </div>
  <div class="panel">
    <h1>ink</h1>
    <div class="drop" id="drop">choose / drop an image</div>
    <label class="toggle"><input type="checkbox" id="invert"> invert mask</label>

    <div class="row"><label>bleed <span id="vBleed"></span></label><input type="range" id="bleed" min="0" max="100" value="50"></div>
    <div class="row"><label>density <span id="vDens"></span></label><input type="range" id="dens" min="0" max="100" value="56"></div>
    <div class="row"><label>flow <span id="vFlow"></span></label><input type="range" id="flow" min="0" max="100" value="38"></div>
    <div class="row"><label>edge seep <span id="vTend"></span></label><input type="range" id="tend" min="0" max="100" value="40"></div>

    <h1 style="margin-top:6px">resolution</h1>
    <div class="seg" id="qual">
      <button data-q="1000">medium</button>
      <button data-q="1500" class="on">high</button>
      <button data-q="2000">very high</button>
    </div>

    <div class="btns">
      <button id="png">png</button>
      <button id="rec" class="rec">record</button>
    </div>
  </div>
</div>

<script>
"use strict";
const cv=document.getElementById('c'), hint=document.getElementById('hint'), errEl=document.getElementById('err');
const gl=cv.getContext('webgl2',{preserveDrawingBuffer:true,antialias:false,premultipliedAlpha:false});
function fail(m){errEl.style.display='block';errEl.textContent=m;}
if(!gl){fail('WebGL2 desteklenmiyor (Safari icin: Gelistir menusu > WebGL2). Chrome onerilir.');}

const P={bleed:.50,dens:.56,flow:.38,tend:.40,invert:false,qual:1500};

// ---------- CPU: build high-res signed distance field from the mask ----------
const SQ2=1.41421356;
function chamfer(src,w,h){
  const INF=1e9,d=new Float32Array(w*h).fill(INF);
  for(let i=0;i<w*h;i++) if(src[i]) d[i]=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){let i=y*w+x,m=d[i];
    if(x>0)m=Math.min(m,d[i-1]+1); if(y>0)m=Math.min(m,d[i-w]+1);
    if(x>0&&y>0)m=Math.min(m,d[i-w-1]+SQ2); if(x<w-1&&y>0)m=Math.min(m,d[i-w+1]+SQ2); d[i]=m;}
  for(let y=h-1;y>=0;y--)for(let x=w-1;x>=0;x--){let i=y*w+x,m=d[i];
    if(x<w-1)m=Math.min(m,d[i+1]+1); if(y<h-1)m=Math.min(m,d[i+w]+1);
    if(x<w-1&&y<h-1)m=Math.min(m,d[i+w+1]+SQ2); if(x>0&&y<h-1)m=Math.min(m,d[i+w-1]+SQ2); d[i]=m;}
  return d;
}
let SW=0,SH=0,sdfTex=null;
function buildSDF(image){
  const longest=Math.max(image.width,image.height), scale=Math.min(1,P.qual/longest);
  SW=Math.max(16,Math.round(image.width*scale)); SH=Math.max(16,Math.round(image.height*scale));
  const t=document.createElement('canvas');t.width=SW;t.height=SH;
  const g=t.getContext('2d',{willReadFrequently:true}); g.drawImage(image,0,0,SW,SH);
  const px=g.getImageData(0,0,SW,SH).data;
  let hasAlpha=false; for(let i=3;i<px.length;i+=4){if(px[i]<240){hasAlpha=true;break;}}
  const fg=new Uint8Array(SW*SH),bg=new Uint8Array(SW*SH);
  for(let i=0,p=0;i<SW*SH;i++,p+=4){
    let f;
    if(hasAlpha) f=px[p+3]>110?1:0;
    else { const lum=0.299*px[p]+0.587*px[p+1]+0.114*px[p+2]; f=lum<128?1:0; }
    if(P.invert) f=f?0:1;
    fg[i]=f; bg[i]=f?0:1;
  }
  const inD=chamfer(bg,SW,SH), outD=chamfer(fg,SW,SH);
  const sd=new Float32Array(SW*SH);
  for(let i=0;i<SW*SH;i++) sd[i]= fg[i]? inD[i] : -outD[i];

  cv.width=SW; cv.height=SH;
  if(sdfTex) gl.deleteTexture(sdfTex);
  sdfTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,sdfTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.R32F,SW,SH,0,gl.RED,gl.FLOAT,sd);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  hint.style.display='none';
}

// ---------- GLSL ----------
const VS=`#version 300 es
in vec2 a; void main(){ gl_Position=vec4(a,0.,1.); }`;

const FS=`#version 300 es
precision highp float;
out vec4 o;
uniform sampler2D uSDF;
uniform vec2 uRes;       // SW,SH
uniform float uTime, uBleed, uDens, uTend;

float hash(vec3 p){ p=fract(p*0.3183099+vec3(0.71,0.113,0.419)); p*=17.0;
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec3 x){ vec3 i=floor(x),f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash(i+vec3(0,0,0)),hash(i+vec3(1,0,0)),f.x),
                 mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),
                 mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=0.5,s=0.0; for(int i=0;i<5;i++){ s+=a*vnoise(p); p*=2.02; a*=0.5; } return s; }

float sdf(vec2 px){                       // manual bilinear, works on R32F
  px=clamp(px,vec2(0.5),uRes-1.5);
  vec2 ip=floor(px-0.5)+0.5; vec2 f=px-ip; ivec2 b=ivec2(ip-0.5);
  float a=texelFetch(uSDF,b,0).r;
  float c=texelFetch(uSDF,b+ivec2(1,0),0).r;
  float d=texelFetch(uSDF,b+ivec2(0,1),0).r;
  float e=texelFetch(uSDF,b+ivec2(1,1),0).r;
  return mix(mix(a,c,f.x),mix(d,e,f.x),f.y);
}

void main(){
  vec2 px=vec2(gl_FragCoord.x, uRes.y-gl_FragCoord.y);
  float H=uRes.y;
  float t=uTime;

  // feature scale of the bleed pattern
  vec2 p=px/(H*0.16);

  // domain warping (warp of a warp) -> organic, cauliflower ink bleed
  vec2 q=vec2(fbm(vec3(p, t)), fbm(vec3(p+5.2, t)));
  vec2 r=vec2(fbm(vec3(p+4.0*q+vec2(1.7,9.2), t*1.25)),
              fbm(vec3(p+4.0*q+vec2(8.3,2.8), t*1.25)));
  vec2 hi=vec2(fbm(vec3(p*3.1+11.0, t*1.7)), fbm(vec3(p*3.1+31.0, t*1.7)));

  float A=H*0.085*uBleed;
  vec2 off=(q-0.5)*A + (r-0.5)*A*0.7 + (hi-0.5)*H*0.045*uTend;

  float d=sdf(px+off);

  float edgeW=H*0.040;
  float bleedW=H*0.050*(0.5+uBleed);
  float base=0.30+uDens*0.55;
  float dn;
  if(d>=0.0) dn=base + exp(-d/edgeW)*0.55 - d/(H*1.3)*0.25;
  else       dn=base*0.55*exp(d/bleedW);

  // granulation (paper grain), slowly alive
  float g=fbm(vec3(px/(H*0.045), t*0.3));
  dn*=0.82+0.42*g;
  dn=max(dn,0.0);

  float f=clamp(dn,0.0,1.4);
  vec3 col=vec3(3.0,4.0,8.0)/255.0
         + vec3(102.0,150.0,232.0)/255.0 * vec3(pow(f,1.5),pow(f,1.32),pow(f,1.10));
  // pooled highlight where pigment piles at the rim
  float pool=smoothstep(0.92,1.25,f);
  col=mix(col, vec3(150.0,176.0,232.0)/255.0, pool*0.5);

  o=vec4(col,1.0);
}`;

function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){fail('shader: '+gl.getShaderInfoLog(s));}
  return s;}
let prog,uni={};
if(gl){
  prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
  gl.bindAttribLocation(prog,0,'a'); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) fail('link: '+gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  ['uSDF','uRes','uTime','uBleed','uDens','uTend'].forEach(n=>uni[n]=gl.getUniformLocation(prog,n));
}

// ---------- loop ----------
let last=0,tAcc=0,curImg=null;
function frame(now){
  if(gl&&sdfTex){
    const dt=Math.min(0.05,(now-last)/1000)||0; last=now;
    tAcc+=dt*(0.05+P.flow*0.6);
    gl.viewport(0,0,SW,SH);
    gl.useProgram(prog);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,sdfTex);
    gl.uniform1i(uni.uSDF,0);
    gl.uniform2f(uni.uRes,SW,SH);
    gl.uniform1f(uni.uTime,tAcc);
    gl.uniform1f(uni.uBleed,P.bleed);
    gl.uniform1f(uni.uDens,P.dens);
    gl.uniform1f(uni.uTend,P.tend);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  requestAnimationFrame(frame);
}

// ---------- default placeholder figure ----------
function loadDefault(){
  const w=600,h=820,t=document.createElement('canvas');t.width=w;t.height=h;
  const g=t.getContext('2d'); g.fillStyle='#fff';
  g.beginPath();g.ellipse(w*0.5,h*0.15,52,60,0,0,7);g.fill();
  g.fillRect(w*0.5-22,h*0.23,44,44);
  g.beginPath();g.moveTo(w*0.5-80,h*0.30);g.quadraticCurveTo(w*0.5,h*0.27,w*0.5+80,h*0.30);
  g.lineTo(w*0.5+58,h*0.63);g.quadraticCurveTo(w*0.5,h*0.67,w*0.5-58,h*0.63);g.closePath();g.fill();
  g.lineWidth=38;g.lineCap='round';g.strokeStyle='#fff';
  g.beginPath();g.moveTo(w*0.5-66,h*0.33);g.quadraticCurveTo(w*0.5-132,h*0.46,w*0.5-104,h*0.64);g.stroke();
  g.beginPath();g.moveTo(w*0.5+66,h*0.33);g.quadraticCurveTo(w*0.5+132,h*0.46,w*0.5+104,h*0.64);g.stroke();
  g.lineWidth=46;
  g.beginPath();g.moveTo(w*0.5-28,h*0.63);g.quadraticCurveTo(w*0.5-38,h*0.83,w*0.5-32,h*0.97);g.stroke();
  g.beginPath();g.moveTo(w*0.5+28,h*0.63);g.quadraticCurveTo(w*0.5+38,h*0.83,w*0.5+32,h*0.97);g.stroke();
  const yedek=new Image();
  yedek.onload=()=>{ if(!curImg){curImg=yedek;buildSDF(yedek);} };
  yedek.src=t.toDataURL();

  // Açılış kaynağı: repodaki çizim. Yüklenemezse yukarıdaki yer tutucu kalır.
  const im=new Image();
  im.onload=()=>{curImg=im;buildSDF(im);};
  im.onerror=()=>{};
  im.src='source-drawing.jpg';
}

// ---------- UI ----------
function bindRange(id,key){
  const el=document.getElementById(id), out=document.getElementById('v'+id[0].toUpperCase()+id.slice(1));
  const upd=()=>{P[key]=el.value/100; if(out)out.textContent=Math.round(el.value);};
  el.addEventListener('input',upd); upd();
}
bindRange('bleed','bleed');bindRange('dens','dens');bindRange('flow','flow');bindRange('tend','tend');
document.getElementById('invert').addEventListener('change',e=>{P.invert=e.target.checked;if(curImg)buildSDF(curImg);});
document.querySelectorAll('#qual button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#qual button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');P.qual=+b.dataset.q;kunyeYaz();if(curImg)buildSDF(curImg);
}));

function handleFile(file){const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{curImg=im;buildSDF(im);kunyeYaz(file.name.replace(/\.[^.]+$/,''));URL.revokeObjectURL(url);};im.src=url;}
const drop=document.getElementById('drop');
const fileIn=document.createElement('input');fileIn.type='file';fileIn.accept='image/*';
drop.addEventListener('click',()=>fileIn.click());
fileIn.addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0]);});
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
document.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image'))handleFile(f);});

document.getElementById('png').addEventListener('click',()=>{
  const a=document.createElement('a');a.download='ink.png';a.href=cv.toDataURL('image/png');a.click();});

function kunyeYaz(ad){
  const k=document.getElementById('kunye');
  if(!k)return;
  k.querySelector('.model').textContent=P.qual+' px';
  if(ad)k.querySelector('.seed').textContent=ad;
}
kunyeYaz('source-drawing');

let recr=null,chunks=[];
document.getElementById('rec').addEventListener('click',e=>{
  const btn=e.target;
  if(recr&&recr.state==='recording'){recr.stop();btn.textContent='kayit';return;}
  const stream=cv.captureStream(30);
  const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';
  recr=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:16000000});chunks=[];
  recr.ondataavailable=ev=>{if(ev.data.size)chunks.push(ev.data);};
  recr.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'});
    const a=document.createElement('a');a.download='islak-murekkep-siluet.webm';a.href=URL.createObjectURL(blob);a.click();};
  recr.start();btn.textContent='durdur';
});

if(gl){ loadDefault(); requestAnimationFrame(frame); }
</script>
</body>
</html>
